<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Секция бокса</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap&subset=cyrillic"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Шапка -->
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <span class="logo-line"></span>
                <span class="logo-text">СЕКЦИЯ<br>БОКСА</span>
            </a>
            <div class="header-center">ДОБРО ПОЖАЛОВАТЬ В КЛУБ</div>
            <div class="header-right">
                <a href="index.html" class="header-button">На главную</a>
            </div>
        </div>
    </header>

    <main class="login-page">
        <div class="login-label">ЛИЧНЫЙ КАБИНЕТ КЛУБА</div>

        <div class="login-card">
            <h1 id="cardTitle">СОЗДАТЬ АККАУНТ</h1>
            <p id="cardText" class="login-text">Зарегистрируйтесь, чтобы управлять своими тренировками.</p>

            <!-- Переключение вкладок -->
            <div class="tabs">
                <button type="button" class="tab" id="tabClient">Вход для клиента</button>
                <button type="button" class="tab active" id="tabRegister">Регистрация</button>
                <button type="button" class="tab" id="tabAdmin">Вход для администратора</button>
            </div>

            <!-- Вход клиента -->
            <form id="clientForm" class="login-form" style="display: none;">
                <div class="form-group">
                    <label for="clientLogin">Логин</label>
                    <input type="text" id="clientLogin" placeholder="Введите логин">
                </div>
                <div class="form-group">
                    <label for="clientPassword">Пароль</label>
                    <input type="password" id="clientPassword" placeholder="Введите пароль">
                </div>
                <p id="clientMessage" class="message"></p>
                <button type="submit" class="button wide-button">Войти</button>
            </form>

            <!-- Регистрация -->
            <form id="registerForm" class="login-form">
                <div class="form-group">
                    <label for="regName">Имя</label>
                    <input type="text" id="regName" placeholder="Введите имя">
                </div>
                <div class="form-group">
                    <label for="regPhone">Телефон</label>
                    <input type="text" id="regPhone" placeholder="+7 (___) ___-__-__">
                </div>
                <div class="form-group">
                    <label for="regLogin">Логин</label>
                    <input type="text" id="regLogin" placeholder="Введите логин">
                </div>
                <div class="form-group">
                    <label for="regPassword">Пароль</label>
                    <input type="password" id="regPassword" placeholder="Введите пароль">
                </div>
                <p id="registerMessage" class="message"></p>
                <button type="submit" class="button wide-button">Зарегистрироваться</button>
            </form>

            <!-- Вход администратора -->
            <form id="adminForm" class="login-form" style="display: none;">
                <div class="form-group">
                    <label for="adminLogin">Логин</label>
                    <input type="text" id="adminLogin" placeholder="Введите логин">
                </div>
                <div class="form-group">
                    <label for="adminPassword">Пароль</label>
                    <input type="password" id="adminPassword" placeholder="Введите пароль">
                </div>
                <p id="adminMessage" class="message"></p>
                <button type="submit" class="button wide-button">Войти</button>
            </form>
        </div>

        <p class="login-hint" id="loginHint"></p>
    </main>

    <!-- Подвал -->
    <footer class="footer">
        <div class="container footer-inner">
            <div class="footer-name">СЕКЦИЯ БОКСА</div>
            <div class="footer-address">Александров, ул. Спортивная, 12</div>
        </div>
    </footer>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
